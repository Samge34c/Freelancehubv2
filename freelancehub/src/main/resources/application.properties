spring.application.name=freelancehub
server.port=${SERVER_PORT:8080}

# DataSource PostgreSQL (con variables de entorno y defaults para desarrollo local)
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/freelancehub}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:postgres}
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.open-in-view=false

# JWT (HS256 requiere al menos 32 bytes de secreto)
jwt.secret=${JWT_SECRET:CAMBIAR_POR_UN_SECRETO_LARGO_PARA_DESARROLLO_FREELANCEHUB_2026}
jwt.expiration=${JWT_EXPIRATION:86400000}

# Swagger / OpenAPI
springdoc.api-docs.enabled=true
springdoc.swagger-ui.enabled=true
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.operationsSorter=method

# Jackson
spring.jackson.serialization.indent_output=true
spring.jackson.default-property-inclusion=non_null

# Logging
logging.level.org.springframework.security=INFO
logging.level.com.freelancehub=DEBUG

# Uploads locales para evidencias de entrega
app.uploads.evidences-dir=${EVIDENCES_UPLOAD_DIR:uploads/evidences}
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB
